name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          $files = gofmt -l .
          if ($files) { Write-Error "gofmt needed: $files"; exit 1 }
      - name: go build
        run: go build ./...
      - name: go test -short
        run: go test -short ./...
